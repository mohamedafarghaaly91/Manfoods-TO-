name: Diagnose Action Plan Metric Snapshots
on:
  workflow_dispatch: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Report store_action_plans / recommendations / metric snapshot counts
      env:
        SQLSERVER_CONNECTION_STRING: ${{ secrets.SQLSERVER_CONNECTION_STRING }}
      run: dotnet run --project MvcApp.csproj -- --diagnose-snapshots
