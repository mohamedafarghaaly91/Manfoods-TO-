name: Run Historical Signal Backfill
on:
  workflow_dispatch: {}
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Run RunHistoricalSignalBackfillAsync against the database
      env:
        SQLSERVER_CONNECTION_STRING: ${{ secrets.SQLSERVER_CONNECTION_STRING }}
      run: dotnet run --project MvcApp.csproj -- --run-signal-backfill
